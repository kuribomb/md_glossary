[project]
name = "md-glossary"
version = "0.1.0"
description = "Alphabetically sort Markdown section headings while preserving hierarchy"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "kuribomb" }]
keywords = ["markdown", "sort", "glossary", "documentation", "headings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]
dependencies = ["markdown-it-py>=3.0"]

[project.urls]
Homepage = "https://github.com/kuribomb/md_glossary"
Repository = "https://github.com/kuribomb/md_glossary"
"Bug Tracker" = "https://github.com/kuribomb/md_glossary/issues"

[project.scripts]
md-glossary = "md_glossary.main:main"

[dependency-groups]
dev = ["ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/md_glossary"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["md_glossary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
